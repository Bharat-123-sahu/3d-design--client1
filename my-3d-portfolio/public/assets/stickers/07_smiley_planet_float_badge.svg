<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256">
<defs>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFDF4"/>
    <stop offset=".42" stop-color="#F7EED6"/>
    <stop offset=".72" stop-color="#D9D0BA"/>
    <stop offset="1" stop-color="#FFF8E9"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFB13A"/>
    <stop offset=".25" stop-color="#FF7A00"/>
    <stop offset=".7" stop-color="#F34C00"/>
    <stop offset="1" stop-color="#C93300"/>
  </linearGradient>
  <linearGradient id="blackMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#252525"/>
    <stop offset=".35" stop-color="#050505"/>
    <stop offset=".7" stop-color="#181818"/>
    <stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7F7F7"/>
    <stop offset=".5" stop-color="#8F8F8F"/>
    <stop offset="1" stop-color="#E7E7E7"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#FFF" stop-opacity="1"/>
    <stop offset=".18" stop-color="#FFD8A6" stop-opacity=".95"/>
    <stop offset=".5" stop-color="#FF6A00" stop-opacity=".6"/>
    <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
  </radialGradient>

  <filter id="drop" x="-35%" y="-35%" width="170%" height="170%">
    <feDropShadow dx="7" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".48"/>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<style>
  .float { animation: float 2.8s ease-in-out infinite; transform-origin:256px 256px; }
  .hover { animation: hover 2.2s ease-in-out infinite; transform-origin:256px 256px; }
  .wobble { animation: wobble 1.8s ease-in-out infinite; transform-origin:256px 256px; }
  .shake { animation: shake 1.15s ease-in-out infinite; transform-origin:256px 256px; }
  .pulse { animation: pulse 1.7s ease-in-out infinite; transform-origin:center; }
  .spin { animation: spin 4.5s linear infinite; transform-origin:256px 256px; }
  .spinSlow { animation: spin 8s linear infinite; transform-origin:256px 256px; }
  .blink { animation: blink 3.1s infinite; transform-origin:center; }
  .blink2 { animation: blink 3.8s infinite .65s; transform-origin:center; }
  .spark { animation: sparkle 1.6s ease-in-out infinite; transform-origin:center; }
  .spark2 { animation: sparkle 1.9s ease-in-out infinite .5s; transform-origin:center; }
  .bounce { animation: bounce 1.45s cubic-bezier(.35,.05,.35,1) infinite; transform-origin:256px 330px; }
  .squash { animation: squash 1.45s cubic-bezier(.35,.05,.35,1) infinite; transform-origin:256px 420px; }
  .flame { animation: flame .48s ease-in-out infinite alternate; transform-origin:256px 338px; }
  .orbit { animation: orbit 5s linear infinite; transform-origin:256px 256px; }
  .wave { animation: wave 1.2s ease-in-out infinite; transform-origin:320px 275px; }
  .glowPulse { animation: glowPulse 1.4s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-13px) rotate(1deg)} }
  @keyframes hover { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
  @keyframes wobble { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg) translateY(-5px)} }
  @keyframes shake { 0%,100%{transform:rotate(-2deg)} 25%{transform:rotate(3deg)} 50%{transform:rotate(-3deg)} 75%{transform:rotate(2deg)} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes blink { 0%,7%,100%{transform:scaleY(1)} 4%{transform:scaleY(.08)} }
  @keyframes sparkle { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.3);opacity:.65} }
  @keyframes bounce { 0%,100%{transform:translateY(0) scaleY(1)} 38%{transform:translateY(-68px) scaleY(1)} 52%{transform:translateY(0) scaleY(.92) scaleX(1.05)} }
  @keyframes squash { 0%,100%{transform:scaleX(1);opacity:.35} 38%{transform:scaleX(.6);opacity:.16} 52%{transform:scaleX(1.18);opacity:.4} }
  @keyframes flame { from{transform:scaleY(.9)} to{transform:scaleY(1.18)} }
  @keyframes orbit { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes wave { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(14deg)} }
  @keyframes glowPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
</style>

<g filter="url(#drop)">
 <g class="orbit" transform="rotate(-20 256 256)">
      <ellipse cx="256" cy="256" rx="177" ry="72" fill="none" stroke="#F9F1DE" stroke-width="36"/>
      <ellipse cx="256" cy="256" rx="177" ry="72" fill="none" stroke="#050505" stroke-width="26"/>
      <ellipse cx="256" cy="256" rx="177" ry="72" fill="none" stroke="url(#orange)" stroke-width="15"/>
      <ellipse cx="256" cy="256" rx="177" ry="72" fill="none" stroke="#FFE7B0" stroke-width="4" stroke-dasharray="82 32"/>
    </g>
 <g class="spark" transform="translate(401 123)">
    <path d="M0 -29 L8 -8 L29 0 L8 8 L0 29 L-8 8 L-29 0 L-8 -8 Z"
      fill="url(#orange)" stroke="#070707" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"
      fill="#FFF9E9" stroke="none"/>
  </g>
 <g class="spark2" transform="translate(112 383)">
    <path d="M0 -19 L5 -5 L19 0 L5 5 L0 19 L-5 5 L-19 0 L-5 -5 Z"
      fill="url(#orange)" stroke="#070707" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 -11 L2 -2 L11 0 L2 2 L0 11 L-2 2 L-11 0 L-2 -2 Z"
      fill="#FFF9E9" stroke="none"/>
  </g>
 <g class="float">
   <path d="M87 203l62-72h218l58 58 18 113-71 82H151l-77-72z"
    fill="url(#blackMetal)" stroke="#F8F0DA" stroke-width="18" stroke-linejoin="round"/>
    <path d="M101 207l56-60h201l49 49 14 97-61 72H160l-66-61z"
    fill="none" stroke="#050505" stroke-width="14" stroke-linejoin="round"/>
    <path d="M119 210l48-48h181l42 41 10 82-50 61H171l-55-49z"
    fill="none" stroke="#FF6200" stroke-width="7" stroke-linejoin="round"/>
    <path d="M149 177h64l-10 18h-69zM322 177h42l15 18h-50zM145 330h66l9 16h-75zM314 331h61l-16 16h-54z"
    fill="#FF6200"/>
   <circle cx="256" cy="257" r="103" fill="url(#orange)" stroke="#050505" stroke-width="15"/>
   <circle cx="256" cy="257" r="78" fill="#F7EED8" stroke="#050505" stroke-width="8"/>
   <g class="blink"><ellipse cx="225" cy="246" rx="14" ry="20" fill="#050505"/><ellipse cx="288" cy="246" rx="14" ry="20" fill="#050505"/></g>
   <path d="M221 291c22 22 49 23 72 0" fill="none" stroke="#050505" stroke-width="10" stroke-linecap="round"/>
   <path d="M184 214c19-23 43-38 72-45" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity=".75"/>
 </g>
</g></svg>