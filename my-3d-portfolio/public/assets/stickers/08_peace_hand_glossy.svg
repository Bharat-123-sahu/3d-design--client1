<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256">
<defs>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFDF4"/>
    <stop offset=".42" stop-color="#F7EED6"/>
    <stop offset=".72" stop-color="#D7CDB6"/>
    <stop offset="1" stop-color="#FFF8E9"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFB03A"/>
    <stop offset=".24" stop-color="#FF7A00"/>
    <stop offset=".72" stop-color="#F34B00"/>
    <stop offset="1" stop-color="#C83200"/>
  </linearGradient>
  <linearGradient id="blackMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#272727"/>
    <stop offset=".35" stop-color="#050505"/>
    <stop offset=".72" stop-color="#171717"/>
    <stop offset="1" stop-color="#000"/>
  </linearGradient>
  <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="8" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".48"/>
  </filter>
</defs>
<style>
  .float{animation:float 2.8s ease-in-out infinite; transform-origin:256px 256px}
  .wobble{animation:wobble 1.7s ease-in-out infinite; transform-origin:256px 256px}
  .blink{animation:blink 3.2s infinite; transform-origin:center}
  .blink2{animation:blink 3.8s infinite .55s; transform-origin:center}
  .bounce{animation:bounce 1.45s cubic-bezier(.35,.05,.35,1) infinite; transform-origin:256px 335px}
  .shadow{animation:shadow 1.45s cubic-bezier(.35,.05,.35,1) infinite; transform-origin:256px 426px}
  .spin{animation:spin 4.4s linear infinite; transform-origin:256px 256px}
  .orbit{animation:spin 7s linear infinite; transform-origin:256px 256px}
  .spark{animation:spark 1.6s ease-in-out infinite; transform-origin:center}
  .spark2{animation:spark 2s ease-in-out infinite .45s; transform-origin:center}
  .flame{animation:flame .46s ease-in-out infinite alternate; transform-origin:256px 360px}
  .dance{animation:dance 1.4s ease-in-out infinite; transform-origin:256px 280px}
  .armL{animation:armL 1s ease-in-out infinite; transform-origin:185px 245px}
  .armR{animation:armR 1s ease-in-out infinite; transform-origin:330px 245px}
  .legL{animation:legL 1s ease-in-out infinite alternate; transform-origin:218px 360px}
  .legR{animation:legR 1s ease-in-out infinite alternate; transform-origin:300px 360px}
  .pulse{animation:pulse 1.5s ease-in-out infinite; transform-origin:center}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-6px)}}
  @keyframes blink{0%,7%,100%{transform:scaleY(1)}4%{transform:scaleY(.08)}}
  @keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}38%{transform:translateY(-68px)}52%{transform:translateY(0) scaleY(.92) scaleX(1.05)}}
  @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.36}38%{transform:scaleX(.62);opacity:.16}52%{transform:scaleX(1.18);opacity:.4}}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes spark{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
  @keyframes flame{from{transform:scaleY(.88)}to{transform:scaleY(1.18)}}
  @keyframes dance{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(5deg) translateY(-8px)}}
  @keyframes armL{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-18deg)}}
  @keyframes armR{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
  @keyframes legL{from{transform:rotate(10deg)}to{transform:rotate(-18deg)}}
  @keyframes legR{from{transform:rotate(-10deg)}to{transform:rotate(18deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>

<g filter="url(#drop)">
  <g class="orbit" transform="rotate(18 256 256)">
      <ellipse cx="256" cy="256" rx="178" ry="68" fill="none" stroke="#FAF1DD" stroke-width="34"/>
      <ellipse cx="256" cy="256" rx="178" ry="68" fill="none" stroke="#050505" stroke-width="25"/>
      <ellipse cx="256" cy="256" rx="178" ry="68" fill="none" stroke="url(#orange)" stroke-width="14"/>
      <ellipse cx="256" cy="256" rx="178" ry="68" fill="none" stroke="#FFE8B2" stroke-width="4" stroke-dasharray="80 34"/>
    </g>
  <g class="spark" transform="translate(398 126)">
      <path d="M0 -27 L8 -8 L27 0 L8 8 L0 27 L-8 8 L-27 0 L-8 -8 Z" fill="url(#orange)" stroke="#050505" stroke-width="8" stroke-linejoin="round"/>
      <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#FFF8E8"/>
    </g>
  <g class="spark2" transform="translate(112 386)">
      <path d="M0 -18 L8 -8 L18 0 L8 8 L0 18 L-8 8 L-18 0 L-8 -8 Z" fill="url(#orange)" stroke="#050505" stroke-width="8" stroke-linejoin="round"/>
      <path d="M0 -9 L4 -4 L9 0 L4 4 L0 9 L-4 4 L-9 0 L-4 -4 Z" fill="#FFF8E8"/>
    </g>
  <g class="wobble">
    <path d="M88 205l61-74h218l58 58 18 112-72 83H151l-77-72z"
      fill="url(#blackMetal)" stroke="#F8F0DB" stroke-width="18" stroke-linejoin="round"/>
      <path d="M102 207l55-59h201l49 49 14 96-61 72H160l-66-61z"
      fill="none" stroke="#050505" stroke-width="14" stroke-linejoin="round"/>
      <path d="M120 211l48-48h180l42 41 10 81-50 61H172l-55-49z"
      fill="none" stroke="#FF6200" stroke-width="7" stroke-linejoin="round"/>
      <path d="M142 177h64l-10 17h-69zM321 177h44l15 17h-51zM142 329h68l10 17h-76zM316 331h60l-16 16h-53z"
      fill="#FF6200"/>
    <path d="M214 386c-43-33-65-78-51-115 10-25 35-30 58-20V152c0-17 13-30 30-30s30 13 30 30v83h12V128c0-17 13-30 30-30s30 13 30 30v113h12v-71c0-17 13-30 30-30s30 13 30 30v131c0 72-46 117-110 117h-58c-17 0-34-6-53-32z"
      fill="url(#cream)" stroke="#050505" stroke-width="15" stroke-linejoin="round"/>
    <path d="M220 276c27 3 51 11 70 24" fill="none" stroke="#FF6200" stroke-width="12" stroke-linecap="round"/>
  </g>
</g></svg>